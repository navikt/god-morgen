apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: god-morgen-cron
  namespace: the-g-team
spec:
  schedule: "0 6 * * 1-5"
  timeZone: "Europe/Oslo"
  concurrencyPolicy: Forbid
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  command:
    - /usr/bin/curl
    - -fsS
    - -X
    - POST
    - http://god-morgen/internal/api/apply-statuses
  accessPolicy:
    outbound:
      rules:
        - application: god-morgen
